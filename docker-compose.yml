services:

  api_bun:
    container_name: api-bun-server
    image: lincenying/bun-api-server:${TAG:-latest}
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DB_DIALECT: postgres
      POSTGRES_HOST: api_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
      POSTGRES_DB: app
    env_file:
      - .env
    ports:
      - '${APP_PORT:-4000}:4000'
    depends_on:
      api_postgres:
        condition: service_healthy
    networks:
      - webnet

  api_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
      POSTGRES_DB: app
    volumes:
      - api_elysia_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d app
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    ports:
      - '${POSTGRES_PUBLISH_PORT:-5432}:5432'
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  api_elysia_pg_data:
